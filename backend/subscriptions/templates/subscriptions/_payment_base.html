<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #0a191e;
        --card: rgba(255, 255, 255, 0.06);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.72);
        --primary: #00a36c;
        --danger: #ff5a5f;
        --warn: #f5a623;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 20% 0%, rgba(0, 163, 108, 0.18), transparent 55%),
          radial-gradient(900px 500px at 100% 30%, rgba(245, 166, 35, 0.12), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        padding: 22px 20px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
      }
      .badge.success { background: rgba(0, 163, 108, 0.18); color: #5dffca; }
      .badge.fail { background: rgba(255, 90, 95, 0.18); color: #ffb3b5; }
      .badge.cancel { background: rgba(245, 166, 35, 0.18); color: #ffd39a; }
      h1 { margin: 14px 0 8px; font-size: 22px; }
      p { margin: 0 0 10px; color: var(--muted); line-height: 1.45; }
      .meta { margin-top: 14px; font-size: 13px; color: var(--muted); }
      code { color: #c7ffd8; }
      .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn.primary { background: var(--primary); color: #fff; }
      .btn.ghost { background: rgba(255, 255, 255, 0.06); color: #fff; border: 1px solid rgba(255, 255, 255, 0.14); }
      .hint { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.62); }
    </style>
  </head>
  <body>
    <div class="card">
      {% block content %}{% endblock %}
      <div class="hint">
        You can safely close this tab and return to the Crop Doctor app.
      </div>
    </div>
  </body>
</html>
